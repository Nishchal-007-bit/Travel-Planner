<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waypoint Trip Planner</title>
<meta name="description" content="Plan flights, stays and days for any trip.">
<meta name="theme-color" content="#0d1722">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Waypoint">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>

/* Layout: one phone-width column. The trip is a rail line: each day is a stop, coloured by the city you sleep in; nights with no stay are dashed. */
:root{
  --paper:#eef1f4; --card:#ffffff; --ink:#14202e; --mut:#586674; --line:#d9e0e7; --soft:#e5eaf0;
  --rose:#c4306f; --rose-ink:#ffffff; --rose-soft:#f8e2ec;
  --ok:#17744b; --ok-soft:#dff3e8; --warn:#a64b08; --warn-soft:#fdeedb;
  --f-disp:"Bricolage Grotesque","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Instrument Sans","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --sh:0 1px 2px rgba(20,32,46,.06),0 8px 24px rgba(20,32,46,.06);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d141c; --card:#16202b; --ink:#e8eef4; --mut:#9aa8b6; --line:#26323e; --soft:#1f2b37;
  --rose:#ff7fae; --rose-ink:#2a0d1a; --rose-soft:#3a1827;
  --ok:#62d19d; --ok-soft:#14301f; --warn:#f2a661; --warn-soft:#3a2a17; --sh:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0d141c; --card:#16202b; --ink:#e8eef4; --mut:#9aa8b6; --line:#26323e; --soft:#1f2b37;
  --rose:#ff7fae; --rose-ink:#2a0d1a; --rose-soft:#3a1827;
  --ok:#62d19d; --ok-soft:#14301f; --warn:#f2a661; --warn-soft:#3a2a17; --sh:none; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1,h2,h3,.disp{font-family:var(--f-disp);text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:6px}
a{color:var(--rose)}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.hdr{padding:20px 0 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.hdr .kan{font-family:var(--f-disp);font-weight:700;color:var(--rose);font-size:14px;letter-spacing:.04em}
.hdr h1{font-size:32px;font-weight:900;line-height:1.1;margin-top:2px}
.hdr .meta{margin-top:6px;color:var(--mut);font-size:14px}
.hdr .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;background:var(--rose-soft);color:var(--rose);font-weight:700;font-size:13px;font-family:var(--f-disp)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:720px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--mut);font-size:12px;font-family:var(--f-disp);font-weight:500;min-height:54px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--rose);font-weight:700}
.nav button[aria-current="page"] svg{stroke-width:2.4}

/* general blocks */
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-size:20px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-family:var(--f-disp);background:var(--soft);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--rose);color:var(--rose-ink)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--rose);font-weight:700;padding:6px 2px;min-height:36px;font-family:var(--f-disp)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:14px;min-height:36px;font-family:var(--f-disp);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 14px;font-family:var(--f-disp);font-weight:700;font-size:14px;min-height:34px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mut);font-family:var(--f-disp);font-weight:500;min-width:0}
input[type=date],input[type=time],input[type=number],input[type=text],select{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:0 10px;color:var(--ink);font-size:15px}
input::placeholder{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stack{display:grid;gap:12px}
.note{font-size:13px;color:var(--mut)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:14px}

/* to-sort list */
.todo{display:grid;gap:8px}
.todo .row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.todo .row b{font-family:var(--f-disp);font-weight:700;display:block;font-size:15px}
.todo .row span{font-size:13px;color:var(--mut)}

/* glance calendar */
.cal{display:grid;gap:14px}
.cal h3{font-size:15px;margin-bottom:6px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dow{font-size:12px;color:var(--mut);font-family:var(--f-disp)}
.cal .c{aspect-ratio:1/1;max-height:46px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-family:var(--f-disp);font-weight:500;position:relative;border:1px solid transparent;background:none;padding:0;color:var(--mut)}
.cal .c.in{color:var(--ink);background:color-mix(in srgb,var(--lc,var(--mut)) 22%,var(--card));border-color:color-mix(in srgb,var(--lc,var(--mut)) 55%,transparent)}
.cal .c.vac{color:var(--ink);border:1px dashed var(--mut)}
.cal .c.today{box-shadow:0 0 0 2px var(--rose)}
.cal .c .fl{position:absolute;right:3px;top:2px;width:7px;height:7px;border-radius:50%;background:var(--rose)}
.cal .c.empty{visibility:hidden}

/* rail */
.rail{margin-top:4px}
.day{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:8px}
.spine{position:relative}
.spine::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:4px;border-radius:2px;background:var(--lc,var(--mut))}
.day.first .spine::before{top:30px}
.day.last .spine::before{bottom:auto;height:30px}
.day.vac .spine::before{background:repeating-linear-gradient(to bottom,var(--mut) 0 6px,transparent 6px 11px);opacity:.55}
.node{position:absolute;left:10px;top:22px;width:20px;height:20px;border-radius:50%;background:var(--card);border:5px solid var(--lc,var(--mut))}
.day.vac .node{border-style:dashed;border-color:var(--mut)}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh);min-width:0;scroll-margin-top:16px}
.dh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dh .d{font-family:var(--f-disp);font-weight:900;font-size:22px;line-height:1.1}
.dh .m{font-family:var(--f-disp);font-weight:500;color:var(--mut)}
.dh .tag{margin-left:auto}
.tag{display:inline-flex;align-items:center;border-radius:8px;padding:2px 8px;font-size:12px;font-family:var(--f-disp);font-weight:700;background:var(--soft);color:var(--ink)}
.tag.rose{background:var(--rose-soft);color:var(--rose)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.city{background:color-mix(in srgb,var(--c,var(--mut)) 18%,var(--card));color:var(--ink);border:1px solid color-mix(in srgb,var(--c,var(--mut)) 45%,transparent)}
.dline{margin-top:8px;font-size:14px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.dline b{font-family:var(--f-disp);font-weight:700}
.vacbox{margin-top:10px;border:1.5px dashed var(--mut);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fchip{margin-top:8px;display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px}
.fchip svg{width:18px;height:18px;flex:none;color:var(--rose)}
.item{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{margin-top:8px}
.item input[type=time]{height:38px;padding:0 6px;font-size:14px}
.item .t{min-width:0}
.item .t b{font-family:var(--f-disp);font-weight:700;font-size:14.5px;display:block;overflow-wrap:anywhere}
.item .t span{font-size:12.5px;color:var(--mut)}
.xbtn{border:0;background:none;color:var(--mut);width:36px;height:36px;border-radius:10px;font-size:20px;line-height:1}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.dsum{font-size:13px;color:var(--mut)}

/* line badge */
.ln{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:var(--lc,var(--mut));color:#fff;font-family:var(--f-disp);font-weight:900;font-size:10.5px;padding:0 3px;flex:none}

/* budget */
.bud .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.bud .row:last-of-type{border:0}
.bud .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-family:var(--f-disp)}
.bud .tot b{font-size:26px;font-weight:900}

/* flights */
.fl h2{font-size:19px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fl .route{font-weight:500;color:var(--mut);font-size:14px}
.land{margin-top:12px;border-radius:14px;background:var(--soft);padding:12px 14px}
.land .big{font-family:var(--f-disp);font-weight:900;font-size:24px;line-height:1.15}
.land .row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:14px}
.land .row span b{font-family:var(--f-disp)}

/* explore + stays cards */
.spot{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);display:grid;gap:6px;min-width:0}
.spot+.spot{margin-top:12px}
.spot .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spot h3{font-size:18px;font-weight:700;line-height:1.25}
.spot .where{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--mut)}
.spot .tip{font-size:14px}
.spot .meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;align-items:center}
.spot .meta span{display:inline-flex;gap:6px;align-items:center}
.spot .meta svg{width:16px;height:16px;color:var(--mut)}
.spot .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tier{font-family:var(--f-disp);font-weight:900;font-size:12.5px;border-radius:8px;padding:2px 8px}
.t-must{background:var(--rose);color:var(--rose-ink)}
.t-great{background:var(--ink);color:var(--paper)}
.t-good{background:var(--soft);color:var(--ink)}
.score{font-family:var(--f-disp);font-weight:700;font-size:14px}
.yen{font-family:var(--f-disp);font-weight:700}
.target{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--rose-soft);color:var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.mapbox{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;margin-bottom:12px}
.mapbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.stay{display:grid;gap:8px;border-left:6px solid var(--c,var(--mut))}
.stay h3{font-size:18px;font-weight:700}
.nearrow{display:flex;gap:8px;flex-wrap:wrap}
.near{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-size:13px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;
  padding:14px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center}
.sheet .in{width:100%;max-width:640px;display:grid;gap:14px;align-content:start}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-size:22px;font-weight:900}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hotel{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:3px}
.hotel b{font-family:var(--f-disp);font-weight:700;font-size:16px}
.hotel .s{font-size:13px;color:var(--mut)}
.hotel+.hotel{margin-top:8px}
.daypick{display:grid;gap:8px}
.daypick button{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;font-family:var(--f-disp);font-weight:700;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;font-family:var(--f-disp);font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
details.g{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px;margin-bottom:10px}
details.g summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;font-size:17px;min-height:48px}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"+";font-size:22px;color:var(--rose);font-weight:500}
details.g[open] summary::after{content:"\2212"}
details.g .body{padding:0 0 14px;display:grid;gap:8px;font-size:14.5px}
details.g ul{margin:0;padding-left:20px;display:grid;gap:6px}
.srcs{font-size:13px;color:var(--mut);display:grid;gap:4px}
.srcs a{color:var(--mut)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--mut)}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.hdr h1{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* additions */
.hl{min-width:0}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:800;color:var(--rose);font-size:15px;letter-spacing:.02em}
.brand svg{width:26px;height:26px;border-radius:7px}
.hdr .btnrow{display:flex;gap:8px}
.btnrow{display:flex;gap:8px;align-items:center}
.btnrow.wrapr{flex-wrap:wrap}
.sortrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--rose-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.prog{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--rose);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.cta{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14.5px;min-height:40px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--rose);margin:0}
.gh{font-family:var(--f-disp);font-weight:800;font-size:13px;color:var(--rose);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.gh:first-child{margin-top:0}
.dact{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbtn{background:none;border:0;color:inherit;font-weight:800;font-family:var(--f-disp);margin-left:10px;text-decoration:underline;min-height:32px}
.tag.ai{background:var(--warn-soft);color:var(--warn)}
.legend i.sq{border-radius:3px}
textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;color:var(--ink);font-size:15px;resize:vertical}
input[type=file]{font-size:14px}
[hidden]{display:none!important}
.btn svg,.linkbtn svg{width:18px;height:18px;flex:none}
input[type=time]{padding:0 4px;font-size:14px}
.item{grid-template-columns:100px minmax(0,1fr) auto}
.sec{flex-wrap:wrap}
.sec h2{white-space:nowrap}
.tm{display:inline-flex;align-items:center;gap:2px}
.tm select{width:auto;min-width:0;padding:0 4px;height:44px;flex:1 1 0;text-align:center;appearance:none;-webkit-appearance:none;background-image:none}
.tm b{color:var(--mut)}
.item .tm select{height:38px;font-size:14px}
.viarow{display:grid;grid-template-columns:minmax(0,1fr) 92px 36px;gap:8px;align-items:end}
.stopinfo{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:13.5px;display:grid;gap:4px}
.hotel.quick{border-style:dashed;margin-bottom:8px}
.grid3 .f{min-width:0}
.tm{display:flex;width:100%}.tm select{padding:0 2px}

const DAY=864e5,HR=36e5;

const isoMs=iso=>{const p=iso.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])};
const msIso=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const addD=(iso,n)=>msIso(isoMs(iso)+n*DAY);

const fmtD=(iso,o)=>new Date(isoMs(iso)).toLocaleDateString(undefined,Object.assign({timeZone:'UTC'},o||{weekday:'short',day:'numeric',month:'short'}));
const hmMin=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
const minHm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const localToday=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};

/* time zones, from the browser's own tz database so any airport works */
const tzCache={};
function tzFmt(tz){return tzCache[tz]||(tzCache[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}))}
function tzOff(tz,u){const p={};tzFmt(tz).formatToParts(new Date(u)).forEach(x=>{p[x.type]=+x.value});return Math.round((Date.UTC(p.year,p.month-1,p.day,p.hour%24,p.minute,p.second)-Math.floor(u/1000)*1000)/60000)}
function toUtc(iso,t,tz){const loc=isoMs(iso)+hmMin(t)*60000;let u=loc-tzOff(tz,loc)*60000;u=loc-tzOff(tz,u)*60000;return u}
function fromUtc(u,tz){const l=u+tzOff(tz,u)*60000,d=new Date(l);return{date:msIso(l),time:pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())}}
const durTxt=m=>Math.floor(m/60)+' h '+pad(m%60)+' min';
const validTz=tz=>{try{tzFmt(tz);return true}catch(e){return false}};

function money(n,cur){try{const f=fmtCache[cur]||(fmtCache[cur]=new Intl.NumberFormat(undefined,{style:'currency',currency:cur,maximumFractionDigits:0}));return f.format(Math.round(n))}catch(e){return cur+' '+Math.round(n).toLocaleString()}}
const hasRate=()=>S.hcur===S.dcur||num(S.rate)>0;

function both(n){

}

async function odPlaces(ck,limit){

function refStay(){

}
function filtered(){
  const ref=refStay();
  const l=allPlaces().filter(s=>{
    if(U.city!=='all'&&s.c!==U.city)return false;
    if(U.cat==='must')return s.s>=4.7;

  if(U.sort==='near')l.sort((a,b)=>a.d-b.d);
  else if(U.sort==='cheap')l.sort((a,b)=>a.s.y-b.s.y||b.s.s-a.s.s);

}

/* simple area sketch: no map tiles, but real relative positions and a scale bar */
function mapSvg(pts,selId){
  const W=360,Hh=330,pd=28;
  if(!pts.length)return '<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="No places to show"><rect width="'+W+'" height="'+Hh+'" style="fill:var(--soft)"/><text x="'+W/2+'" y="'+Hh/2+'" text-anchor="middle" font-size="13" style="fill:var(--mut)">Nothing to show on the map yet</text></svg>';
  const la=pts.map(p=>p.lat),lo=pts.map(p=>p.lon),latMin=Math.min.apply(null,la),latMax=Math.max.apply(null,la),lonMin=Math.min.apply(null,lo),lonMax=Math.max.apply(null,lo);
  const cLat=(latMin+latMax)/2,cLon=(lonMin+lonMax)/2,kx=Math.cos(cLat*Math.PI/180);
  const spanY=Math.max(latMax-latMin,0.02),spanX=Math.max((lonMax-lonMin)*kx,0.03),sc=Math.min((W-2*pd)/spanX,(Hh-2*pd-16)/spanY);
  const X=lon=>W/2+(lon-cLon)*kx*sc,Y=lat=>Hh/2-8-(lat-cLat)*sc,pxKm=sc/111.2;
  let g='<rect width="'+W+'" height="'+Hh+'" style="fill:var(--soft)"/>';
  for(let x=20;x<W;x+=40)g+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+Hh+'" style="stroke:var(--line);stroke-width:1;stroke-dasharray:2 5"/>';
  for(let y=20;y<Hh;y+=40)g+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--line);stroke-width:1;stroke-dasharray:2 5"/>';
  const nice=[0.2,0.5,1,2,5,10,20,50,100,200,500].filter(k=>k*pxKm<=W*0.32).pop()||0.2;
  g+='<g transform="translate(14 '+(Hh-14)+')"><line x2="'+(nice*pxKm).toFixed(1)+'" style="stroke:var(--ink);stroke-width:2.5;stroke-linecap:round"/><text y="-7" font-size="11" style="fill:var(--ink);font-family:var(--f-disp);font-weight:700">'+nice+' km</text></g>';
  pts.slice().sort((a,b)=>(a.id===selId)-(b.id===selId)).forEach(p=>{
    const x=X(p.lon),y=Y(p.lat),sel=p.id===selId;
    const clr=p.type==='spot'?(p.s>=4.7?'var(--rose)':p.s>=4.5?'var(--ink)':'var(--mut)'):'var(--card)';
    const shape=p.type==='spot'?'<circle r="'+(sel?10:7.5)+'" style="fill:'+clr+';stroke:var(--card);stroke-width:2"/>':'<rect x="-8" y="-8" width="16" height="16" rx="4" style="fill:var(--card);stroke:var(--ink);stroke-width:2.5"/><circle r="3" style="fill:var(--ink)"/>';
    const nm=p.n.length>26?p.n.slice(0,25)+'…':p.n;
    g+='<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+')" data-act="pin" data-id="'+esc(p.id)+'" style="cursor:pointer" role="button" tabindex="0" aria-label="'+esc(p.n)+'">'+(sel?'<circle r="16" style="fill:none;stroke:var(--rose);stroke-width:3"/>':'')+'<circle r="18" style="fill:transparent"/>'+shape+(sel?'<text y="-22" text-anchor="middle" font-size="11" style="fill:var(--ink);font-family:var(--f-disp);font-weight:700;stroke:var(--card);stroke-width:4;paint-order:stroke">'+esc(nm)+'</text>':'')+'</g>';
  });
  return '<svg viewBox="0 0 '+W+' '+Hh+'" role="group" aria-label="Sketch map of the area">'+g+'</svg>';
}

/* ================= starter plan from Claude ================= */
async function buildStarter(){
  if(U.build&&!U.build.err)return;
  const b={text:'Looking up '+S.dest+'…'};U.build=b;const T=S;render(true);
  const live=()=>U.build===b&&S===T;
  try{
    let g=null;
    try{g=(await geoSearch(S.dest))[0]}catch(e){if(!SAMPLE)throw e}
    if(g&&live()){
      const r=await odAddCity({name:S.dest,lat:g.lat,lon:g.lon,cc:g.cc,full:g.full,area:g.area,city:g.city},t=>{if(live()){b.text=t;render(true)}});
      if(!live())return;
      if(S.cities[r.ck]&&!cityKeys().length)ensureCity(S.dest,S.dest,g.lat,g.lon);
      if(r.err&&!SAMPLE)throw r.err;
      if(r.p||r.h){U.build=null;render(true);toast(S.dest+': '+r.p+' sights, '+r.h+' hotels found');return}
    }
    if(!SAMPLE)throw {code:'net'};
    if(!T.ai.overview){b.text='Asking Claude about '+S.dest+'…';render(true);await aiOverview();persist()}
    if(!live())return;
    if(!cityKeys().length)ensureCity(S.dest,S.dest,null,null);
    for(const ck of cityKeys().slice(0,3)){
      if(!live())return;
      b.text='Finding places in '+cityName(ck)+'…';render(true);
      if(!S.places.some(p=>p.c===ck))await aiPlaces(ck);persist();
      if(!live())return;
      b.text='Finding hotels in '+cityName(ck)+'…';render(true);
      if(!S.hotels.some(h=>h.c===ck))await aiHotels(ck);persist();
    }
    if(!live())return;
    U.build=null;render(true);toast('Suggestions are ready');
  }catch(e){if(U.build===b){U.build={err:e&&e.code?(odErr(e)):(aiErr(e)||'Something went wrong.')};render(true)}}
}

  msg.hidden=!m;msg.textContent=m;msg.className=info?'okbox':'warnbox';return !m||info;

function fitStays(a,b,keep){
  const out=[];
  S.stays.forEach(x=>{
    if(x.id===keep||!(x.in<b&&a<x.out)){out.push(x);return}
    if(x.in<a&&x.out>b){out.push(Object.assign({},x,{out:a}));out.push(Object.assign({},x,{id:'s'+uid(),in:b}))}
    else if(x.in<a){out.push(Object.assign({},x,{out:a}))}
    else if(x.out>b){out.push(Object.assign({},x,{in:b}))}
  });
  S.stays=out;
}
